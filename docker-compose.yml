services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fairstage
      POSTGRES_PASSWORD: fairstage
      POSTGRES_DB: fairstage
    ports:
      - "5432:5432"
    volumes:
      - fairstage_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairstage"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  fairstage_db:
